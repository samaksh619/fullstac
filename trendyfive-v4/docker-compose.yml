services:
  mysql:
    image: mysql:8.4
    container_name: trendyfive-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trendyfive
      MYSQL_USER: trendyfive
      MYSQL_PASSWORD: trendyfive
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - trendyfive_mysql_data:/var/lib/mysql
volumes:
  trendyfive_mysql_data:
