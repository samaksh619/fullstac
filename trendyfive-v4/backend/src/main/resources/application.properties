spring.application.name=trendyfive-marketplace-api
server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Easy local development: H2 is the default. Use the mysql profile for MySQL.
spring.datasource.url=jdbc:h2:mem:trendyfive;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.profiles.group.mysql=mysql
